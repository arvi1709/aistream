repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-aws-credentials
      - id: detect-private-key
      - id: check-added-large-files
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
  - repo: local
    hooks:
      - id: block-env
        name: Block .env from commits
        entry: bash -c 'if git diff --cached --name-only | grep -q "\.env"; then echo ".env is staged — aborting commit"; exit 1; fi'
        language: system
        stages: [commit]
